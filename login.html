<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login — CRITLOG
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<header class="nav">


  <a
    href="index.html"
    class="logo"
  >
    CRITLOG
  </a>


  <nav>

    <a href="explore.html">
      Explore
    </a>

    <a href="index.html#how">
      How it works
    </a>

  </nav>


  <div class="nav-right">

    <a href="index.html">
      Back to Home
    </a>

  </div>


</header>



<!-- =========================
     LOGIN
========================= -->

<main class="login-page">


  <div class="login-box">


    <p class="eyebrow">
      WELCOME BACK
    </p>


    <h1>
      Log in to CRITLOG
    </h1>


    <p class="login-description">

      Continue documenting your critiques,
      revisiting feedback, and developing your work.

    </p>



    <!-- LOGIN FORM -->

    <form id="loginForm">


      <!-- EMAIL -->

      <label for="email">
        Email
      </label>


      <input
        type="text"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >



      <!-- PASSWORD -->

      <label for="password">
        Password
      </label>


      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >



      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="button-primary login-button"
      >
        Log in
      </button>


    </form>



    <!-- MOCK LOGIN INFORMATION -->

    <p
      style="
        margin-top: 18px;
        font-size: 12px;
        color: #999;
        text-align: center;
      "
    >

      Prototype version — enter any email and password.

    </p>



    <!-- SIGN UP -->

    <p class="signup-text">

      Don't have an account?

      <a href="#">
        Sign up
      </a>

    </p>


  </div>


</main>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="script.js"></script>


</body>

</html>
